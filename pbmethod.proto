package pbdson;

option java_package = "protocol";
option java_outer_classname = "Pbmethod";

message RequestData {
  optional string session = 1;
  repeated PbAction actions = 2;
}

message ResponseData {
  repeated PbAction aAction = 2;
}

message PbRegister{
  optional string username = 1;
  optional  string password = 2;
  optional string phone = 3;
  optional  string salt = 4;
  optional  string checksum = 5;
  optional string udid = 6;
  optional string os = 7;
  optional string device = 8;
  optional string version = 9 ;
  optional string operatorName = 10;
  optional string cp = 11;
}

message PbLoginGame{
  optional string session = 1;
  optional PbUser user = 2;
}

// --------------------  region battle new --------------------
message PbPos {
  optional float x = 1;
  optional float y = 2;
}

enum CellState{
  ACTIVE = 1;
  HIDE = 2;
}




enum SubStateType {
  ADD_BONUS = 1;          // custom size
  DIE = 2;                // faction
  REVIVE = 3;
  PLAY_ANIM = 4;
  BE_DAMAGE = 5;          // attackerId - crit - atkDame - critDame
  EFFECT_BODY = 6;        // effect Id, time
  RE_HP = 7;              // recovery hp
  UPDATE_CHAT_FRAME = 8;
  UPDATE_TRIAL = 9;
  UPDATE_ITEM_SLOT = 10;  // item buf in player
  UPDATE_TEXT_DAME = 11;
  UPDATE_MULTI_POINT = 12; // [point id - cur] chỉ dùng số ít point, không phải toàn bộ point
  USE_ITEM_SLOT = 13;     // slot
  UPDATE_DIRECTION = 14; // update direction for unit
  UPDATE_ITEM_EQUIP = 15; // 8 itemKey dang mac (theo EquipSlotType)
  REMOVE_EQUIPMENT = 16;  // rowId user_equipment
  REMOVE_MATERIAL = 17;   // rowId user_material
  IN_HEAL_ZONE = 18;      // 0 = ngoài zone hồi máu, 1 = trong zone
  BONUS_ADD_FORCE = 19;   // [posX*1000, posY*1000, ...bonus wire] battle loot FX
}

enum StateType {
  TYPE_ADD_REMOVE = 1;
  TYPE_POS = 2;
  TYPE_UNIT_STATE = 3;
  TYPE_CHUNK_STATE = 4;
}

enum CellObjectType{
  ROCK = 1;
  SIGN = 2;
  CACTUS = 3;
  FLOWER = 4;
  SKULL = 5;
  CHEST = 6;
  BONES = 7;
  GRAVESTONE = 8;
  HELMET = 9;
}

// item id trong DB / bonus consumable (đồng bộ server + client)
enum ItemKey {
  BINH_MAU_1 = 1;
  BINH_MAU_2 = 2;
  BINH_MAU_3 = 3;
  BINH_MAU_4 = 4;
  GOLD = 5;
  GEM = 6;
  RUBY = 7;
  CUP = 8;
  TREASURE_KEY = 9;
}

enum  ItemPointKey {
  CO_VAT =1 ;
  TICKER_MINI = 2;
  TICKER_NORMAL = 3;
  TICKER_SPECIAL = 4;
  CHIP = 5;
  BONG_LINH_THU = 6;
  BONG_SIEU_THU = 7;
  LOA_THE_GIOI = 8;
  RUBY_X2_VOUCHER = 13; // vé x2 ruby khi nạp
  ARENA_COIN = 14; // xu đấu trường
}

// user_item.type / res_item.type — loại lưu trữ item (đồng bộ server + client)
enum ItemType {
  POSITION = 1;
  CURRENCY = 2;
  KEY = 3; // chìa khóa runtime (treasure)
}

enum ItemPointType {
  EVENT = 1;
  USE = 2;
  SPEAKER = 3;
  OPEN_BOX = 4;
}

message PbUnit{
  // chung cả add + remove
  optional int32 type = 1;
  optional int32 chunkId = 2;
  optional  int64 id = 3;
  optional  bool isAdd = 4;
  // dành cho add unit
  optional  int32 clanId = 5;
  optional int32  avatar = 6;
  optional int64  ownerId = 7;
  optional PbPos pos = 8;
  optional PbPos direction = 9;
  optional int32 speed = 10;
  repeated int32 info = 11;
  optional  float rangeAttack = 12;
  optional  string name = 13;
  optional  bool  alive = 14;
  optional int64 lastInputSeq = 15;
  repeated int64 point = 16;
  optional int32 userId = 17;
  optional int64 timeProtected = 18;
}

message PbCell {
  optional int32 id = 1;
  optional CellState state = 2;
  optional int32 hp = 3;
}

message PbListChunk {
  repeated PbChunk aChunk = 1;
}

message PbChunk {
  optional int32 id = 1;
  optional bool isAdd = 2;
  optional PbPos pos = 3;
  repeated PbCell cells = 4;
}

message PbPointItemUpdate{
  optional int64 itemId = 1;
  optional int32 typeBonus = 2;
  repeated float  points = 3;
}

message PbInitMap {
  optional int32 mapId = 1;
  optional int64 battleId = 2;
  repeated PbChunk chunks = 3;  // AOI ban đầu (tối đa 9 chunk)
  repeated PbUnit units = 4;
  optional int64 timeProtected = 5;
}

// lúc đã init xong thì trả về state để update trạng thái của client
message PbState{
  optional float serverTime = 1;
  repeated PbUnitPos unitPos = 2;
  repeated PbUnit unitAdd = 3;
  optional PbUnitUpdate unitUpdate = 4;
  repeated PbChunk chunkState = 5;
}

// state ngắn dùng listlong siêu nhẹ
message PbListUnitState {
  repeated PbUnitState aUnitState = 1;
}

message  PbUnitState{
  optional int64 id = 1;
  repeated int32 status = 2; // type - length
  repeated int64 point = 3; // data
}

